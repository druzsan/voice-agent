name: voice-agent

services:
  postgres:
    image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    environment:
      POSTGRES_USER: voice_agent
      POSTGRES_DB: voice_agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voice_agent}
    volumes:
      # PostgreSQL 18 images keep their data in a versioned folder below this path
      - database:/var/lib/postgresql
    healthcheck:
      test: [CMD, pg_isready, --username, voice_agent, --dbname, voice_agent]
      interval: 2s
      timeout: 3s
      retries: 15

  # One-shot: migrates the database with the backend image, then exits
  migrate:
    # The same build as the backend, so both share one image build
    build:
      context: backend
      target: runtime
    command: [alembic, upgrade, head]
    env_file:
      - path: .env
        required: false
    environment:
      VOICE_AGENT_DATABASE_URL: postgresql+psycopg://voice_agent:${POSTGRES_PASSWORD:-voice_agent}@postgres:5432/voice_agent
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: backend
      target: runtime
    env_file:
      - path: .env
        required: false
    environment:
      VOICE_AGENT_DATABASE_URL: postgresql+psycopg://voice_agent:${POSTGRES_PASSWORD:-voice_agent}@postgres:5432/voice_agent
      # Also from the shell, e.g. echo in CI; empty means the default
      VOICE_AGENT_LLM_PROVIDER: ${VOICE_AGENT_LLM_PROVIDER:-}
    volumes:
      # The speech models: the same folder as on the host, where the app
      # downloads missing ones at startup. It's part of the repository (empty),
      # so Docker never creates it as root.
      - type: bind
        source: ./backend/models
        target: /app/models
        bind:
          create_host_path: false
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: frontend
      target: runtime
    ports:
      - 127.0.0.1:8080:8080
    depends_on:
      backend:
        condition: service_healthy

volumes:
  database:
