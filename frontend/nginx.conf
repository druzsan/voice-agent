# Serves the built frontend and forwards /api to the backend

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 8080;
    root /usr/share/nginx/html;

    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        # A 30 s recording (16 kHz, 16-bit WAV) is about 1 MB, nginx's default limit
        client_max_body_size 2m;
        proxy_http_version 1.1;
        # With the port, as the browser sent it: the backend compares it with
        # the Origin of a call
        proxy_set_header Host $http_host;
        # Live calls run over a WebSocket (/api/call) ...
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # ... which can be quiet for longer than the default 60 s, e.g. while
        # the caller is muted (calls end after 15 minutes anyway)
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
