name: Image scan

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *" # Daily at 09:00 UTC

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy:
    name: "🔒 Scan image (${{ matrix.service }})"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: compose.yaml
          targets: ${{ matrix.service }}
          load: true
          set: |
            ${{ matrix.service }}.tags=voice-agent-${{ matrix.service }}:scan
            ${{ matrix.service }}.cache-from=type=gha,scope=${{ matrix.service }}-production

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          scan-type: image
          image-ref: voice-agent-${{ matrix.service }}:scan
          scanners: vuln,secret
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          exit-code: "0"

      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}
