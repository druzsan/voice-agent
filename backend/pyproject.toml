[project]
name = "voice-agent"
version = "0.1.0"
description = "Voice agent for automotive customer complaints"
requires-python = ">=3.12,<4"
dependencies = [
    "alembic>=1.20.1",
    "fastapi[standard]>=0.162.0",
    "faster-whisper>=1.2.1",
    "genai-prices>=0.2.1",
    "numpy>=2.5.4",
    "openai>=3.45.0",
    "piper-tts>=1.8.0",
    "psycopg[binary]>=3.3.8",
    "pydantic>=2.14.2",
    "pydantic-ai-slim[openai]>=2.66.0",
    "pydantic-settings>=2.16.2",
    "sqlalchemy[asyncio]>=2.1.8",
]

[tool.uv]
package = false
# faster-whisper 1.2.1 passes metadata_errors to av.open, which av 19 removed
constraint-dependencies = ["av<19"]

[dependency-groups]
dev = [
    "check-jsonschema>=0.39.0",
    "ipython>=9.18.1",
    "pre-commit>=4.7.0",
    "pre-commit-hooks>=6.0.0",
    "pyright[nodejs]>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff.lint]
extend-select = ["I"]

[tool.pyright]
typeCheckingMode = "strict"

[tool.pytest.ini_options]
pythonpath = ["."]
# The speech tests need the real models (downloaded on the first run); the
# OpenAI tests an API key, and they cost a few cents
addopts = ["-m", "not speech and not openai"]
markers = [
    "speech: needs the real speech models (run them with `make test-speech`)",
    "openai: calls OpenAI's speech models (run them with `make test-openai`)",
]


[tool.alembic]
script_location = "%(here)s/migrations"
file_template = "%%(year)d_%%(month).2d_%%(day).2d_%%(rev)s_%%(slug)s"
prepend_sys_path = ["."]

# Format and lint new revisions like the rest of the code
[[tool.alembic.post_write_hooks]]
name = "ruff_format"
type = "exec"
executable = "%(here)s/.venv/bin/ruff"
options = "format REVISION_SCRIPT_FILENAME"

[[tool.alembic.post_write_hooks]]
name = "ruff_check"
type = "exec"
executable = "%(here)s/.venv/bin/ruff"
options = "check --fix REVISION_SCRIPT_FILENAME"
