[project]
name = "voice-agent"
version = "0.1.0"
description = "Voice agent for automotive customer complaints"
requires-python = ">=3.12,<4"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "check-jsonschema>=0.39.0",
    "ipython>=9.18.1",
    "pre-commit>=4.7.0",
    "pre-commit-hooks>=6.0.0",
    "pyright[nodejs]>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff.lint]
extend-select = ["I"]

[tool.pyright]
typeCheckingMode = "strict"

[tool.pytest.ini_options]
pythonpath = ["."]
